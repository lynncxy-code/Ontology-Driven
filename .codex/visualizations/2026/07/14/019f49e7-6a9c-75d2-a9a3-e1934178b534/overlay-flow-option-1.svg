<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#444"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; fill: #1a1a1a; }
      .title { font-size: 28px; font-weight: 600; }
      .sub { font-size: 16px; fill: #666; }
      .head { font-size: 18px; font-weight: 600; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #666; }
      .screen { fill: #fff; stroke: #222; stroke-width: 2; rx: 6; }
      .panel { fill: #fafafa; stroke: #cfcfcf; stroke-width: 1; }
      .line { stroke: #d8d8d8; stroke-width: 1; }
      .selected { fill: #f0f0f0; stroke: #222; stroke-width: 1.5; }
      .button { fill: #1a1a1a; rx: 5; }
      .buttonText { fill: #fff; font-size: 14px; font-weight: 600; }
      .flow { stroke: #444; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="800" fill="#fff"/>
  <text x="50" y="52" class="title">方案 1：分散到现有页面</text>
  <text x="50" y="82" class="sub">类型默认在本体页配置，实例覆盖在运维页配置，两套页面分别承担编辑。</text>

  <rect x="40" y="125" width="400" height="520" class="screen"/>
  <rect x="40" y="125" width="400" height="54" fill="#f6f6f6" stroke="#222" stroke-width="2" rx="6"/>
  <text x="62" y="158" class="head">本体配置中心 / 空压机</text>
  <line x1="180" y1="179" x2="180" y2="645" class="line"/>
  <text x="62" y="211" class="small">设备类型</text>
  <rect x="56" y="230" width="108" height="38" class="panel"/>
  <text x="73" y="254" class="body">机器人</text>
  <rect x="56" y="276" width="108" height="38" class="selected"/>
  <text x="73" y="300" class="body">空压机</text>
  <rect x="56" y="322" width="108" height="38" class="panel"/>
  <text x="73" y="346" class="body">AGV</text>
  <text x="198" y="211" class="small">I3D_Overlay 类型默认</text>
  <text x="198" y="249" class="small">模板</text>
  <rect x="198" y="260" width="222" height="38" class="panel"/>
  <text x="210" y="285" class="body">标题 + 状态 + 指标</text>
  <text x="198" y="329" class="small">字段绑定</text>
  <rect x="198" y="340" width="222" height="76" class="panel"/>
  <text x="210" y="367" class="body">设备名称、状态</text>
  <text x="210" y="393" class="body">温度、压力</text>
  <rect x="272" y="575" width="148" height="44" class="button"/>
  <text x="300" y="603" class="buttonText">保存类型默认</text>

  <path d="M455 385 H505" class="flow"/>
  <text x="458" y="365" class="small">切换页面</text>

  <rect x="520" y="125" width="400" height="520" class="screen"/>
  <rect x="520" y="125" width="400" height="54" fill="#f6f6f6" stroke="#222" stroke-width="2" rx="6"/>
  <text x="542" y="158" class="head">实例运维 / 空压机 A-03</text>
  <line x1="660" y1="179" x2="660" y2="645" class="line"/>
  <text x="542" y="211" class="small">实例列表</text>
  <rect x="536" y="230" width="108" height="38" class="panel"/>
  <text x="549" y="254" class="body">A-01</text>
  <rect x="536" y="276" width="108" height="38" class="panel"/>
  <text x="549" y="300" class="body">A-02</text>
  <rect x="536" y="322" width="108" height="38" class="selected"/>
  <text x="549" y="346" class="body">A-03</text>
  <text x="678" y="211" class="small">本实例覆盖</text>
  <text x="678" y="249" class="small">模板</text>
  <rect x="678" y="260" width="222" height="38" fill="#fff" stroke="#999" stroke-dasharray="5 4"/>
  <text x="690" y="285" class="small">继承类型默认</text>
  <text x="678" y="329" class="small">标题</text>
  <rect x="678" y="340" width="222" height="38" class="panel"/>
  <text x="690" y="365" class="body">空压机 A-03</text>
  <rect x="752" y="575" width="148" height="44" class="button"/>
  <text x="780" y="603" class="buttonText">保存实例覆盖</text>

  <path d="M935 385 H985" class="flow"/>
  <text x="937" y="365" class="small">同步</text>

  <rect x="1000" y="125" width="360" height="520" class="screen"/>
  <rect x="1000" y="125" width="360" height="54" fill="#f6f6f6" stroke="#222" stroke-width="2" rx="6"/>
  <text x="1022" y="158" class="head">UE 场景</text>
  <line x1="1030" y1="560" x2="1330" y2="520" class="line"/>
  <rect x="1060" y="420" width="105" height="120" fill="#fff" stroke="#666" stroke-width="3"/>
  <line x1="1165" y1="420" x2="1205" y2="350" stroke="#444" stroke-width="2"/>
  <rect x="1190" y="235" width="145" height="135" class="screen"/>
  <text x="1207" y="264" class="head">空压机 A-03</text>
  <text x="1207" y="289" class="small">运行中</text>
  <line x1="1207" y1="301" x2="1318" y2="301" class="line"/>
  <text x="1207" y="327" class="body">温度</text><text x="1276" y="327" class="body">42 °C</text>
  <text x="1207" y="351" class="body">压力</text><text x="1270" y="351" class="body">0.82</text>

  <rect x="40" y="690" width="1320" height="68" fill="#fafafa" stroke="#d4d4d4"/>
  <text x="62" y="720" class="head">使用链路</text>
  <text x="180" y="720" class="body">本体页配置类型默认</text>
  <text x="390" y="720" class="body">→</text>
  <text x="430" y="720" class="body">切换到实例页配置覆盖</text>
  <text x="675" y="720" class="body">→</text>
  <text x="715" y="720" class="body">UE 显示结果</text>
  <text x="180" y="746" class="small">特点：两个入口、两个编辑页面，语义直接但操作分散。</text>
</svg>
