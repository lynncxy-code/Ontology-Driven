<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OntoTwin Nexus</title>
  <link rel="stylesheet" href="/release-badge.css">
  <script src="/release-badge.js" defer></script>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#202428;background:#f5f6f7}*{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{min-height:100vh;display:grid;grid-template-columns:238px 1fr}.side{background:#fff;border-right:1px solid #e5e8eb;padding:22px 16px;display:flex;flex-direction:column;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:0 7px 27px}.brand img{width:32px;height:32px}.brand strong{display:block;font-size:15px}.brand span{display:block;color:#80878e;font-size:11px;margin-top:3px}.group{margin:15px 0 6px 8px;color:#9299a1;font-size:11px}.nav{display:flex;align-items:center;gap:9px;width:100%;border:0;background:#fff;text-align:left;padding:10px 11px;border-radius:8px;font:inherit;font-size:13px;color:#555d65;cursor:pointer}.nav:hover,.nav.active{background:#f0f1f3;color:#202428;font-weight:600}.nav-icon{width:17px;color:#858d95;text-align:center;font-size:15px}.side-foot{margin-top:auto;padding:18px 8px 4px;color:#9aa1a8;font-size:11px}.main{min-width:0;display:flex;flex-direction:column}.topbar{height:64px;background:#fff;border-bottom:1px solid #e7eaed;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.context{font-size:13px;color:#555e66}.context strong{color:#252a2f;font-weight:600}.top-actions{display:flex;align-items:center;gap:12px}.link{border:0;background:none;color:#5d6670;font:inherit;font-size:12px;cursor:pointer;padding:7px 9px;border-radius:7px}.link:hover{background:#f3f4f5;color:#202428}.frame{flex:1;width:100%;height:calc(100vh - 64px);border:0;background:#f7f8f9}.empty-frame{display:grid;place-items:center;color:#717981;font-size:13px;height:100%}@media(max-width:760px){.shell{display:block}.side{display:none}.topbar{padding:0 18px}}
  .nav-icon svg{display:block;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .side{transition:width .2s ease,padding .2s ease}.shell.collapsed{grid-template-columns:68px 1fr}.side.collapsed{width:68px;padding-left:10px;padding-right:10px}.side.collapsed .brand{justify-content:center;padding-left:0;padding-right:0}.side.collapsed .brand>div,.side.collapsed .group,.side.collapsed .side-foot{display:none}.side.collapsed .nav{justify-content:center;padding-left:0;padding-right:0;font-size:0}.side.collapsed .nav-icon{font-size:16px}.collapse-footer{border-top:1px solid #edf0f2;padding-top:10px;margin-top:auto}.collapse-btn{display:flex;align-items:center;gap:9px;width:100%;height:36px;padding:0 10px;border:0;border-radius:8px;background:#fff;color:#737b83;font:inherit;font-size:12px;cursor:pointer}.collapse-btn:hover{background:#f3f4f5;color:#202428}.collapse-btn svg{display:block;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.side.collapsed .collapse-btn{justify-content:center;padding:0}.side.collapsed .collapse-text{display:none}.side-foot{margin-top:0}
  </style>
</head>
<body>
  <div class="shell"><aside class="side"><div class="brand"><img src="/assets/ontotwin-logo.svg" alt="OntoTwin"><div><strong>OntoTwin Nexus</strong><span>本体驱动工业数字孪生平台</span></div></div><div class="group">数据定义</div><button class="nav" data-title="语义图谱总览" data-url="/ontology_graph?nexus=true"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg></span>语义图谱总览</button><button class="nav" data-title="本体配置中心" data-url="/ontology?nexus=true"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></span>本体配置中心</button><div class="group">模型工坊</div><button class="nav" data-title="CAD 一键成模" data-url="/cad_generator?nexus=true"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M8 16L16 8"></path><path d="M10 8h6v6"></path><path d="M7 12h2"></path><path d="M12 17v-2"></path></svg></span>CAD 一键成模</button><button class="nav" data-title="坐标标定工作台" data-url="/coord?nexus=true"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line><circle cx="7" cy="7" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="17" cy="17" r="1.5" fill="currentColor" stroke="none"></circle></svg></span>坐标标定</button><div class="group">实例接入</div><button class="nav" data-title="实例绑定台" data-url="/binding?nexus=true"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></span>实例绑定台</button><div class="group">场景交互</div><button class="nav" data-title="信息面板" data-url="/interaction?nexus=true&feature=overlay"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 8h10M7 12h7M7 16h4"></path></svg></span>信息面板</button><button class="nav" data-title="人物漫游" data-url="/interaction?nexus=true&feature=roaming"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"></circle><path d="M9 22l1-6-3-3 2-5 4 2 3 3h3"></path><path d="M13 10l-1 5 4 2 2 5"></path></svg></span>人物漫游</button><button class="nav" data-title="漫游路线" data-url="/interaction?nexus=true&feature=routes"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2"></circle><circle cx="18" cy="6" r="2"></circle><path d="M7 18h3a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3"></path></svg></span>漫游路线</button><button class="nav" data-title="Web 交互" data-url="/interaction?nexus=true&feature=web"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 9h18M8 6.5h.01M11 6.5h.01"></path></svg></span>Web 交互</button><div class="group">运行守护</div><button class="nav" data-title="实例运维与监控" data-url="/instance?nexus=true"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg></span>实例运维与监控</button><button class="nav" data-title="外部数据监控台" data-url="/floor_pulse?nexus=true"><span class="nav-icon"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg></span>外部数据监控台</button><button class="nav" data-title="回收站" data-url="/trash?nexus=true"><span class="nav-icon"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg></span>回收站</button><div class="side-foot">OntoTwin Nexus · 4.8</div></aside><section class="main"><header class="topbar"><div class="context"><strong id="contextOrg">本地工作环境</strong><span id="contextPage"> / 语义图谱总览</span></div></header><iframe id="frame" class="frame" src="/ontology_graph?nexus=true" allow="fullscreen; clipboard-read; clipboard-write; gamepad"></iframe></section></div>
  <script>
    (()=>{const frame=document.querySelector('#frame'),title=document.querySelector('#contextPage'),org=document.querySelector('#contextOrg');const buttons=[...document.querySelectorAll('.nav')];const safe=u=>u.startsWith('/')&&!u.startsWith('//')&&!u.includes('\\');function select(b){buttons.forEach(x=>x.classList.toggle('active',x===b));title.textContent=' / '+b.dataset.title}function go(b){if(!safe(b.dataset.url))return;select(b);frame.src=b.dataset.url}buttons.forEach(b=>b.onclick=()=>go(b));fetch('/api/v4.8/auth/me',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).then(async me=>{if(!me?.context?.organization_id)return;const os=await fetch('/api/v4.8/organizations',{credentials:'same-origin'}).then(r=>r.ok?r.json():{items:[]});const o=(os.items||[]).find(x=>x.organization_id===me.context.organization_id);const fs=await fetch('/api/v4.8/organizations/'+encodeURIComponent(me.context.organization_id)+'/factories',{credentials:'same-origin'}).then(r=>r.ok?r.json():{items:[]});const f=(fs.items||[]).find(x=>x.factory_id===me.context.factory_id);if(o)org.textContent=o.name+(f?' / '+f.name:'')});select(buttons[0]);})();
  </script>
  <script>
    (()=>{
      const side=document.querySelector('.side');
      const oldFoot=side&&side.querySelector('.side-foot');
      if(side&&!document.querySelector('#collapseButton')){
        const wrap=document.createElement('div');
        wrap.className='collapse-footer';
        wrap.innerHTML='<button class="collapse-btn" id="collapseButton" type="button" title="展开/收起导航"><span class="collapse-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg></span><span class="collapse-text">收起侧栏</span></button>';
        side.insertBefore(wrap,oldFoot||null);
        wrap.querySelector('#collapseButton').addEventListener('click',()=>{side.classList.toggle('collapsed');side.closest('.shell').classList.toggle('collapsed',side.classList.contains('collapsed'))});
      }
      const top=document.querySelector('.topbar');
      if(top&&!document.querySelector('#release-badge')){
        const actions=document.createElement('div'); actions.className='top-actions';
        actions.innerHTML='<div id="release-badge" class="release-badge" aria-label="环境与版本"></div>';
        top.appendChild(actions);
        const script=document.createElement('script'); script.src='/release-badge.js'; script.defer=true; document.head.appendChild(script);
      }
      const frame=document.querySelector('#frame');
      const buttons=[...document.querySelectorAll('.nav')];
      const navigationKey=value=>{const u=new URL(value,location.origin);return u.pathname==='/interaction'?`${u.pathname}?feature=${u.searchParams.get('feature')||'overlay'}`:u.pathname};
      const syncActiveMenu=url=>{const key=navigationKey(url);const b=buttons.find(x=>navigationKey(x.dataset.url)===key);if(b){buttons.forEach(x=>x.classList.toggle('active',x===b));const title=document.querySelector('#contextPage');if(title)title.textContent=' / '+b.dataset.title}};
      frame&&frame.addEventListener('load',()=>{try{const u=frame.contentWindow.location;syncActiveMenu(`${u.pathname}${u.search}`)}catch(_){}});
    })();
  </script>
</body>
</html>
