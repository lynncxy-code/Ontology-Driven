<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OntoTwin Nexus</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#202428;background:#f5f6f7}*{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{min-height:100vh;display:grid;grid-template-columns:238px 1fr}.side{background:#fff;border-right:1px solid #e5e8eb;padding:22px 16px;display:flex;flex-direction:column;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:0 7px 27px}.brand img{width:32px;height:32px}.brand strong{display:block;font-size:15px}.brand span{display:block;color:#80878e;font-size:11px;margin-top:3px}.group{margin:15px 0 6px 8px;color:#9299a1;font-size:11px}.nav{display:flex;align-items:center;gap:9px;width:100%;border:0;background:#fff;text-align:left;padding:10px 11px;border-radius:8px;font:inherit;font-size:13px;color:#555d65;cursor:pointer}.nav:hover,.nav.active{background:#f0f1f3;color:#202428;font-weight:600}.nav-icon{width:17px;color:#858d95;text-align:center;font-size:15px}.side-foot{margin-top:auto;padding:18px 8px 4px;color:#9aa1a8;font-size:11px}.main{min-width:0;display:flex;flex-direction:column}.topbar{height:64px;background:#fff;border-bottom:1px solid #e7eaed;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.context{font-size:13px;color:#555e66}.context strong{color:#252a2f;font-weight:600}.top-actions{display:flex;align-items:center;gap:12px}.link{border:0;background:none;color:#5d6670;font:inherit;font-size:12px;cursor:pointer;padding:7px 9px;border-radius:7px}.link:hover{background:#f3f4f5;color:#202428}.frame{flex:1;width:100%;height:calc(100vh - 64px);border:0;background:#f7f8f9}.empty-frame{display:grid;place-items:center;color:#717981;font-size:13px;height:100%}@media(max-width:760px){.shell{display:block}.side{display:none}.topbar{padding:0 18px}}
  </style>
</head>
<body>
  <div class="shell"><aside class="side"><div class="brand"><img src="/assets/ontotwin-logo.svg" alt="OntoTwin"><div><strong>OntoTwin Nexus</strong><span>本体驱动工业数字孪生平台</span></div></div><div class="group">数据定义</div><button class="nav" data-title="语义图谱总览" data-url="/ontology_graph?nexus=true"><span class="nav-icon">◇</span>语义图谱总览</button><button class="nav" data-title="本体配置中心" data-url="/ontology?nexus=true"><span class="nav-icon">◌</span>本体配置中心</button><div class="group">模型工坊</div><button class="nav" data-title="CAD 一键成模" data-url="/cad_generator?nexus=true"><span class="nav-icon">↗</span>CAD 一键成模</button><button class="nav" data-title="坐标标定" data-url="/coord?nexus=true"><span class="nav-icon">⊕</span>坐标标定</button><div class="group">实例接入</div><button class="nav" data-title="实例绑定台" data-url="/binding?nexus=true"><span class="nav-icon">↔</span>实例绑定台</button><div class="group">场景交互</div><button class="nav" data-title="信息面板" data-url="/interaction?nexus=true&feature=overlay"><span class="nav-icon">▤</span>信息面板</button><button class="nav" data-title="人物漫游" data-url="/interaction?nexus=true&feature=roaming"><span class="nav-icon">♙</span>人物漫游</button><button class="nav" data-title="漫游路线" data-url="/interaction?nexus=true&feature=routes"><span class="nav-icon">⌁</span>漫游路线</button><button class="nav" data-title="Web 交互" data-url="/interaction?nexus=true&feature=web"><span class="nav-icon">▣</span>Web 交互</button><div class="group">运行守护</div><button class="nav" data-title="实例运维与监控" data-url="/instance?nexus=true"><span class="nav-icon">▣</span>实例运维与监控</button><button class="nav" data-title="回收站" data-url="/trash?nexus=true"><span class="nav-icon">⌫</span>回收站</button><div class="side-foot">OntoTwin Nexus · 4.8</div></aside><section class="main"><header class="topbar"><div class="context"><strong id="contextOrg">本地工作环境</strong><span id="contextPage"> / 语义图谱总览</span></div></header><iframe id="frame" class="frame" src="/ontology_graph?nexus=true" allow="fullscreen; clipboard-read; clipboard-write; gamepad"></iframe></section></div>
  <script>
    (()=>{const frame=document.querySelector('#frame'),title=document.querySelector('#contextPage'),org=document.querySelector('#contextOrg');const buttons=[...document.querySelectorAll('.nav')];const safe=u=>u.startsWith('/')&&!u.startsWith('//')&&!u.includes('\\');function select(b){buttons.forEach(x=>x.classList.toggle('active',x===b));title.textContent=' / '+b.dataset.title}function go(b){if(!safe(b.dataset.url))return;select(b);frame.src=b.dataset.url}buttons.forEach(b=>b.onclick=()=>go(b));fetch('/api/v4.8/auth/me',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).then(async me=>{if(!me?.context?.organization_id)return;const os=await fetch('/api/v4.8/organizations',{credentials:'same-origin'}).then(r=>r.ok?r.json():{items:[]});const o=(os.items||[]).find(x=>x.organization_id===me.context.organization_id);const fs=await fetch('/api/v4.8/organizations/'+encodeURIComponent(me.context.organization_id)+'/factories',{credentials:'same-origin'}).then(r=>r.ok?r.json():{items:[]});const f=(fs.items||[]).find(x=>x.factory_id===me.context.factory_id);if(o)org.textContent=o.name+(f?' / '+f.name:'')});select(buttons[0]);})();
  </script>
</body>
</html>
