[project]
name = "ontotwin-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9,<2", "httpx>=0.27"]  # pin 1.x：FastMCP API 稳定（mcp 2.0.0 是大版本，API 可能变，Task 1 Step 2 核对）

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
ontotwin-mcp = "ontotwin_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 只把 Python 包 ontotwin_mcp 打进去。发行根目录同时有 skills/、sample-data/，
# 不显式限定的话 setuptools 扁平布局自动发现会撞出「Multiple top-level packages discovered」，
# 导致 pip install（含 install.ps1）在解压后的发行包上直接失败。
[tool.setuptools.packages.find]
include = ["ontotwin_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
