services:
  db:
    image: ${DB_IMAGE}
    environment:
      POSTGRES_USER: ontotwin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ontotwin
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ontotwin -d ontotwin']
      interval: 3s
      timeout: 3s
      retries: 30
  neo4j:
    image: ${NEO4J_IMAGE}
    environment:
      NEO4J_AUTH: neo4j/${DB_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes: [graph:/data]
  backend:
    image: ${BACKEND_IMAGE}
    ports: ['127.0.0.1:${PORT:-5000}:5000']
    depends_on:
      db: {condition: service_healthy}
    environment:
      ONTOTWIN_STORE: pg
      ONTOTWIN_RELEASE_ID: ${RELEASE_ID}
      ONTOTWIN_MOCK_SIMULATOR_ENABLED: 'false'
      DATABASE_URL: postgresql://ontotwin:${DB_PASSWORD}@db:5432/ontotwin
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${DB_PASSWORD}
      MODELS_DIR: /models
    volumes: [data:/app/data, models:/models]
volumes:
  db:
    labels: {ontotwin.instance: '${INSTANCE_ID}'}
  graph:
    labels: {ontotwin.instance: '${INSTANCE_ID}'}
  data:
    labels: {ontotwin.instance: '${INSTANCE_ID}'}
  models:
    labels: {ontotwin.instance: '${INSTANCE_ID}'}
