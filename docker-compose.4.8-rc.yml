name: ontotwin48-rc

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.4.8-rc
    image: ontotwin:4.8-rc.8
    ports:
      - "5200:5000"
    environment:
      DATABASE_URL: postgresql://ontotwin:ontotwin@db:5432/ontotwin
      ONTOTWIN_STORE: pg
      ONTOTWIN_RELEASE_ID: 4.8-rc.8
      MODELS_DIR: /models
      ONTOTWIN_MOCK_SIMULATOR_ENABLED: "false"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ontotwin123
    volumes:
      - ontotwin48_rc_models:/models
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: Dockerfile.4.8-rc-db
    image: ontotwin:4.8-rc.8-db
    environment:
      POSTGRES_USER: ontotwin
      POSTGRES_PASSWORD: ontotwin
      POSTGRES_DB: ontotwin
    ports:
      - "55432:5432"
    volumes:
      - ontotwin48_rc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontotwin -d ontotwin"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/ontotwin123
    ports:
      - "57474:7474"
      - "57687:7687"
    volumes:
      - ontotwin48_rc_neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ontotwin123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  ontotwin48_rc_models:
  ontotwin48_rc_pgdata:
  ontotwin48_rc_neo4jdata:
