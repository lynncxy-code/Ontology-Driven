services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
      - ./assets:/assets
      - ./exports:/exports
      # 3.3 后端预取：把 UE 固定 Models 目录挂进来，后端从 ArtStudio 下载 glb 落到这里，
      # UE 直接读本地文件（绕开 UE HTTP 的代理/并发/连接坑）。换机改 MODELS_HOST_DIR 即可。
      - ${MODELS_HOST_DIR:-D:/SCC/DigitalFactoryBase_SCC/Models}:/models
    environment:
      - ONTOTWIN_MIDDLEWARE_URL=http://host.docker.internal:5001
      - MODELS_DIR=/models
      # 3.3.2 ArtStudio 新库；可通过宿主机环境变量切回其他资产源。
      - ARTSTUDIO_BASE_URL=${ARTSTUDIO_BASE_URL:-https://artstudio.digioasis.tech/api}
      - ARTSTUDIO_TIMEOUT=${ARTSTUDIO_TIMEOUT:-5}
      - ARTSTUDIO_TOKEN=${ARTSTUDIO_TOKEN:-}
      # 3.4 PostgreSQL 真源（容器内用服务名 db 连）
      - DATABASE_URL=postgresql://ontotwin:ontotwin@db:5432/ontotwin
      - ONTOTWIN_STORE=pg
      # 3.7.x 视频面板：逗号分隔。HTTP 来源还必须同时列入 HTTP_EXCEPTIONS。
      - ONTOTWIN_MEDIA_ALLOWED_HOSTS=${ONTOTWIN_MEDIA_ALLOWED_HOSTS:-}
      - ONTOTWIN_MEDIA_HTTP_EXCEPTIONS=${ONTOTWIN_MEDIA_HTTP_EXCEPTIONS:-}
      # 3.4 Neo4j 本体图库（容器内用服务名 neo4j 连；图库不可达时相关接口降级 503，不影响主功能）
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=ontotwin123
    depends_on:
      db:
        condition: service_healthy

  # 3.4 PostgreSQL —— 本体/实例/分区的单一真源
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=ontotwin
      - POSTGRES_PASSWORD=ontotwin
      - POSTGRES_DB=ontotwin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化自动建表（仅在数据卷为空时执行一次）
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontotwin -d ontotwin"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 3.4 Neo4j —— 本体（语义层）唯一真源；图模型由 vendored 灵枢工具链生成
  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/ontotwin123
    ports:
      - "7474:7474"   # 浏览器控制台 http://localhost:7474
      - "7687:7687"   # bolt 协议（驱动连接用）
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ontotwin123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

volumes:
  pgdata:
  neo4jdata:
