<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OntoTwin 3.8.2 业务配置台 Demo</title>
  <script src="/vendor/vue-3.3.4.global.prod.js"></script>
  <script src="/vendor/axios-1.7.9.min.js"></script>
  <style>
    :root{
      --ink:#1a1a1a;--ink-2:#5c5c5c;--ink-3:#8a8a8a;
      --line:#e8e8e8;--line-2:#d4d4d4;--bg:#fff;--bg-2:#fafafa;--bg-3:#f3f3f3;--on-ink:#fff;
      --danger:#b42318;--danger-bg:#fef3f2;--warn:#b54708;--warn-bg:#fffaeb;--ok:#067647;
      --r-sm:6px;--r-md:8px;--r-lg:12px;
      --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;
      --t-xs:11px;--t-sm:12px;--t-base:13px;--t-md:14px;--t-lg:16px;--t-xl:20px;
      --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    }
    *{box-sizing:border-box}
    html,body,#app{height:100%;margin:0}
    body,button,input,select,textarea{font:var(--t-base) var(--font)}
    button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
    .web-workspace{height:100%}
    .field{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--bg);color:var(--ink)}
    .field:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px rgba(26,26,26,.06)}
    textarea.field{resize:vertical}
    .form-row{display:flex;flex-direction:column;gap:6px}
    .label{font-size:var(--t-xs);font-weight:600;color:var(--ink-2)}
    .hint{margin:0;font-size:var(--t-xs);line-height:1.45;color:var(--ink-3)}
    .btn{padding:8px 14px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--bg);color:var(--ink);font-weight:550}
    .btn:hover{background:var(--bg-3)}
    .btn-primary{border-color:var(--ink);background:var(--ink);color:#fff}
    .btn-ghost{border-color:transparent;background:transparent}
    .btn-sm{padding:6px 10px;font-size:var(--t-sm)}
    .segmented{display:grid;padding:3px;border-radius:var(--r-md);background:var(--bg-3);gap:2px}
    .segment{padding:7px 5px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--ink-2)}
    .segment.active{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(20,20,20,.08);font-weight:600}
    .modal-mask{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,20,20,.4)}
    .modal{width:min(480px,92vw);max-height:82vh;overflow:auto;padding:24px;border-radius:12px;background:#fff;box-shadow:0 16px 48px rgba(20,20,20,.18)}
    .modal h3{margin:0 0 12px}.modal p{margin:0;color:var(--ink-2);line-height:1.6}
    .modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
    .loading{height:100%;display:grid;place-items:center;color:var(--ink-3)}
    input[type=checkbox],input[type=radio]{accent-color:var(--ink)}
  </style>
  <link rel="stylesheet" href="/web_interaction_workbench.css">
</head>
<body>
  <div id="app" class="web-workspace">
    <web-workbench @toast="toast"></web-workbench>
  </div>
  <script>
    const sample = {
      project_id: "ds_1785130727581",
      project_name: "SCC W19",
      revision: 4,
      has_previous_published: true,
      draft_validation: { valid: true, errors: [], warnings: [] },
      draft: {
        pages: [
          {
            page_id: "page.energy",
            name: "能源管控总览",
            enabled: true,
            base_url: "http://localhost:5000/ue_hud/pages/energy-overview.html",
            param_mapping: { business_view_id: "business_id" },
            declared_extra_params: [],
            scope_effects: { zone: "web_and_scene", business_view: "web_and_scene", instance: "web_and_scene" }
          },
          {
            page_id: "page.station",
            name: "站位详情",
            enabled: true,
            base_url: "http://localhost:5000/ue_hud/pages/s5-workstation.html",
            param_mapping: { instance_id: "instance_id" },
            declared_extra_params: [],
            scope_effects: { instance: "web_and_scene" }
          }
        ],
        business_views: [
          {
            business_view_id: "bv.energy",
            name: "能源管理",
            description: "集中查看厂房能源设备与运行状态。",
            enabled: true,
            scene_behavior: "isolate_focus",
            rule_groups: [{ zone_ids: [], object_type_rids: ["type.energy"], instance_ids: [] }],
            exclude_instance_ids: []
          },
          {
            business_view_id: "bv.inspect",
            name: "重点设备巡检",
            description: "每日巡检的关键设备。",
            enabled: true,
            scene_behavior: "highlight",
            rule_groups: [{ zone_ids: [], object_type_rids: [], instance_ids: ["ue_001", "ue_004"] }],
            exclude_instance_ids: []
          }
        ],
        bindings: [{
          binding_id: "bind.energy",
          name: "能源主页",
          enabled: true,
          trigger: "business_view_activated",
          activation_mode: "explicit",
          effect: "open_web",
          scope: { business_view_id: "bv.energy" },
          page_id: "page.energy"
        }],
        web_policy: { allowed_hosts: ["localhost"] }
      }
    };

    const zones = [
      { id: "zone.1f", name: "一层能源区" },
      { id: "zone.2f", name: "二层生产区" },
      { id: "zone.out", name: "室外能源区" }
    ];
    const types = [
      { rid: "type.energy", name: "能源设备" },
      { rid: "type.robot", name: "移动机器人" }
    ];
    const instances = [
      { id: "ue_001", display_name: "1F 配电柜 A", object_type_rid: "type.energy", zone_id: "zone.1f" },
      { id: "ue_002", display_name: "1F 空压机", object_type_rid: "type.energy", zone_id: "zone.1f" },
      { id: "ue_003", display_name: "2F 光伏逆变器", object_type_rid: "type.energy", zone_id: "zone.2f" },
      { id: "ue_004", display_name: "室外储能柜", object_type_rid: "type.energy", zone_id: "zone.out" },
      { id: "ue_005", display_name: "巡检机器人 01", object_type_rid: "type.robot", zone_id: "zone.2f" },
      { id: "ue_006", display_name: "待分区能耗表", object_type_rid: "type.energy", zone_id: "" }
    ];

    axios.get = async (url) => ({
      data: url.includes("web-interactions")
        ? sample
        : url.includes("/zones")
          ? { zones, unassigned_count: 1 }
          : url.includes("/ontology/types")
            ? types
            : instances
    });
    axios.post = async (url, body) => {
      if (url.includes("/apply")) {
        sample.revision += 1;
        sample.draft = JSON.parse(JSON.stringify(body.config));
        return { data: { status: "ok", revision: sample.revision, config: sample.draft, warnings: [] } };
      }
      return { data: { status: "ok" } };
    };
  </script>
  <script src="/web_interaction_workbench.js"></script>
  <script>
    Vue.createApp({
      methods: { toast(message, type) { console.log(type, message); } },
      components: { WebWorkbench: window.OntoTwinWebWorkbench }
    }).mount("#app");
  </script>
</body>
</html>
