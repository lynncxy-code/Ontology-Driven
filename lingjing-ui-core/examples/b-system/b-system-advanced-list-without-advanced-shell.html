<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>高级筛选列表反例 · 缺少高级壳</title>
  <link rel="stylesheet" href="../../components/dist/lingjing-core-b-system.css">
</head>
<body>
  <div class="b-layout-sidebar">
    <aside class="b-sidebar">
      <div class="b-sidebar-header">
        <span class="b-sidebar-logo">Lingjing</span>
      </div>
      <nav class="b-sidebar-nav">
        <a href="#" class="b-sidebar-nav-link is-active">工单列表（误标为 advanced_list）</a>
      </nav>
    </aside>
    <div class="b-main">
      <header class="b-header">
        <div class="b-header-left">
          <nav class="b-breadcrumb">
            <div class="b-breadcrumb-item">
              <span class="b-breadcrumb-current">工单列表（仅顶部筛选，反例）</span>
            </div>
          </nav>
        </div>
      </header>
      <main class="b-content">
        <!-- 反例：这里故意只使用普通 list 的 search-bar + data-table-container，没有 advanced-data-table 壳，也没有 filter-panel -->
        <section class="content-card">
          <div class="card-header">
            <h2 class="card-title">当前班次工单</h2>
          </div>
          <div class="search-bar">
            <input type="text" class="search-input" placeholder="按工单号 / 任务名称搜索">
            <select class="filter-select"><option>全部状态</option></select>
          </div>
          <div class="data-table-container">
            <table class="data-table">
              <thead><tr><th>工单号</th><th>任务名称</th><th>状态</th></tr></thead>
              <tbody><tr><td>WO-001</td><td>示例任务</td><td><span class="badge badge-success">进行中</span></td></tr></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
